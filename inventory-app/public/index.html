<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory Control System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header>
      <h1>📦 E-Commerce Inventory Control System</h1>
      <p class="subtitle">Live warehouse dashboard &amp; batch logging</p>
    </header>

    <main>
      <!-- Live Status / Dashboard -->
      <section class="card">
        <h2>Live Status</h2>
        <table id="inventory-table">
          <thead>
            <tr>
              <th>Item Name</th>
              <th>Batch #</th>
              <th>Quantity</th>
              <th>Unit Cost</th>
              <th>Last Updated</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="inventory-body">
            <tr><td colspan="6" class="empty">Loading...</td></tr>
          </tbody>
        </table>
      </section>

      <div class="row">
        <!-- Log Entry Form -->
        <section class="card">
          <h2>Batch Log Entry</h2>
          <form id="batch-form">
            <label>
              Item Name
              <input type="text" id="item_name" required placeholder="e.g. Wireless Mouse" />
            </label>
            <label>
              Batch Number
              <input type="text" id="batch_number" required placeholder="e.g. B-1001" />
            </label>
            <label>
              Quantity In Stock
              <input type="number" id="quantity_in_stock" required min="0" placeholder="0" />
            </label>
            <label>
              Unit Cost
              <input type="number" id="unit_cost" required min="0" step="0.01" placeholder="0.00" />
            </label>
            <button type="submit">Submit Update</button>
            <p id="form-message"></p>
          </form>
        </section>

        <!-- History Feed -->
        <section class="card">
          <h2>Recent Batch Changes</h2>
          <ul id="log-feed">
            <li class="empty">Loading...</li>
          </ul>
        </section>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
